# Use on a server after pointing DOMAIN at its IP and confirming display rights.
# docker compose -f compose.yaml -f compose.public.yaml up -d --build
services:
  consentdesk:
    environment:
      PUBLIC_MODE: "true"
      SECURE_COOKIES: "true"
      TRUST_PROXY: "true"
    volumes:
      - ./backups:/app/backups
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - consentdesk
volumes:
  caddy_data:
  caddy_config:
